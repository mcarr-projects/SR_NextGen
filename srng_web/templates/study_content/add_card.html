{% extends 'base.html' %}

{% block title %}Add Card{% endblock %}

{% block content %}
<h1> Add Card </h1>

{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Card</button>
</form>
{% endblock %}
